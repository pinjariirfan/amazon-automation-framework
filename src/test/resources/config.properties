# Application
base.url=https://www.amazon.in
search.keyword=wireless mouse
# Delivery PIN code (amazon.in) / ZIP code (amazon.com) applied via the "Deliver to" widget
# 560068 = Bommanahalli, HSR Layout area, Bengaluru, Karnataka
delivery.zip=560068
# How many search results to try before giving up (some products have no direct "Add to Cart")
max.products.to.try=6

# Browser: chrome | edge | firefox  (override with -Dbrowser=...)
browser=chrome
# Headless mode (override with -Dheadless=true)
headless=false

# Timeouts (seconds)
explicit.wait=20
page.load.timeout=60
