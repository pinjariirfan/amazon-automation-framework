# Application
base.url=https://www.amazon.com
search.keyword=wireless mouse
# US ZIP used as the delivery location so items are shippable/addable to cart
delivery.zip=10001
# How many search results to try before giving up (some products have no direct "Add to Cart")
max.products.to.try=6

# Browser: chrome | edge | firefox  (override with -Dbrowser=...)
browser=chrome
# Headless mode (override with -Dheadless=true)
headless=false

# Timeouts (seconds)
explicit.wait=20
page.load.timeout=60
